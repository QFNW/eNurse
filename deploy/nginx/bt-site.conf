# eNurse — BT Panel (宝塔) site config fragment
# This replaces the container-nginx approach: BT Panel's nginx serves the
# web-admin static files and reverse-proxies /api to the server container
# on 127.0.0.1:3000. SSL is handled by BT Panel (one-click Let's Encrypt),
# so no cert files need to be managed manually.
#
# How to apply (BT Panel UI):
#   1. 网站 → 添加站点: domain = your domain, PHP version = 纯静态,
#      root = /www/wwwroot/enurse (must match WEB_ROOT in deploy.sh)
#   2. 网站 → 设置 → 配置文件: paste everything below INTO the existing
#      server { } block, REPLACING the default `location /` block.
#   3. 网站 → SSL → Let's Encrypt: one-click issue + auto-renew; it also
#      sets up the 80 → 443 redirect.
#
# If pages return 403 after deploying: delete .user.ini in the site root
# (BT writes it for 防跨站 protection).

# SPA fallback — web-admin static files
location / {
    root /www/wwwroot/enurse;
    index index.html;
    try_files $uri $uri/ /index.html;
}

# Long-cache hashed assets (vite emits assets/* with content hashes)
location /assets/ {
    root /www/wwwroot/enurse;
    expires 30d;
    add_header Cache-Control "public, immutable";
}

# API reverse proxy → server container (loopback only)
# proxy_pass without a URI keeps the full /api/... path untouched
location /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 30s;
    proxy_read_timeout 60s;
}
