# eNurse production nginx (container-nginx fallback; BT Panel variant uses bt-site.conf)
# Replace every occurrence of bohack26.kdns.fr if you deploy to a different domain.

server {
    listen 80;
    server_name bohack26.kdns.fr;
    # ACME HTTP-01 challenge (Let's Encrypt) — remove if using cloud-vendor cert
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name bohack26.kdns.fr;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 10m;

    # ---- web-admin (SPA) ----
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---- API + Swagger ----
    location /api/ {
        proxy_pass http://server:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
